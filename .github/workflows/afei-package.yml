name: A-FEI- Windows 启动器发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    if: github.repository == 'nodesire7/Lichii' && github.ref == 'refs/heads/afei-zh'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Read draft release
        id: release
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^afei-launcher-v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $draft = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft -or $draft.targetCommitish -notmatch '^[0-9a-f]{40}$') {
            throw 'A draft release pinned to a commit is required'
          }
          "commit=$($draft.targetCommitish)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Install Qt 6.8.3 for the simulator plugin
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase
          setup-python: false
          cache: true
      - name: Build and test launcher
        shell: pwsh
        run: |
          python -m pip install PySide6-Essentials==6.11.0 PyInstaller==6.21.0
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m unittest discover -s afei-launcher -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          ./afei-launcher/build.ps1
          ctest --test-dir afei-launcher/build/qt-overlay -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Qt translation plugin test failed' }
          Remove-Item Env:QT_PLUGIN_PATH,Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'afei-smoke'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $lock = Join-Path $env:LOCALAPPDATA 'Lichii-AFEI/launcher.lock'
          $app = Start-Process -FilePath 'afei-launcher/dist/Lichii-AFEI.exe' -PassThru -WindowStyle Hidden
          try {
            for ($i = 0; $i -lt 30 -and -not $app.HasExited -and -not (Test-Path $lock); $i++) {
              Start-Sleep -Seconds 1
            }
            if ($app.HasExited -or -not (Test-Path $lock)) { throw 'Packaged launcher did not start' }
          } finally {
            if (-not $app.HasExited) { taskkill /PID $app.Id /T /F | Out-Null }
          }
      - name: Upload checked package and publish release
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Replace('afei-launcher-', '')
          $name = "Lichii-AFEI-$version-win64.zip"
          $stage = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'afei-release')
          Copy-Item -LiteralPath 'afei-launcher/dist/Lichii-AFEI.exe','afei-launcher/THIRD-PARTY.md','LICENSE.txt' -Destination $stage.FullName
          Copy-Item -LiteralPath 'afei-launcher/README.md' -Destination (Join-Path $stage.FullName '使用说明.md')
          $zip = Join-Path $env:RUNNER_TEMP $name
          Compress-Archive -Path (Join-Path $stage.FullName '*') -DestinationPath $zip
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$sha256  $name" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
          gh release upload $env:RELEASE_TAG $zip "$zip.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
          $remote = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          $asset = $remote.assets | Where-Object { $_.name -eq $name -and $_.digest -eq "sha256:$sha256" }
          if (-not $asset) { throw 'Remote asset digest mismatch' }
          gh release edit $env:RELEASE_TAG --draft=false --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish draft release' }
